name: Build Packages (development)

on:
  push:
    branches:
      - "develop"
    paths:
      - "srcpkgs/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: "x86_64"
        BOOTSTRAP: "x86_64"
        TEST: 1

    steps:
      - name: Prepare container
        run: |
          # switch to repo-ci mirror
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          # install dependencies
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y sudo bash curl git github-cli ripgrep
          # create non-root user
          useradd -G xbuilder -M builder

      - name: Checkout custom packages
        run: |
          git clone --depth=1 --branch=develop --recursive --shallow-submodules https://github.com/${{ github.repository }} noid-packages
          cd noid-packages && git submodule update --init --remote void-packages

      - name: Merge custom repositories
        run: |
          cd noid-packages
          cp -f common/travis/changed_templates.sh \
            void-packages/common/travis/changed_templates.sh
          cat common/shlibs | tee -a \
            void-packages/common/shlibs
          cp -r srcpkgs/* void-packages/srcpkgs/
          cp common/repo-keys/fd\:a3\:7d\:ab\:fe\:ed\:b4\:4e\:20\:48\:3e\:ab\:0b\:02\:7d\:45.plist void-packages/common/repo-keys

      - name: Prepare masterdir
        run: |
          cd noid-packages/void-packages
          sed -i '1i repository=https://github.com/noid-linux/xbps-repo/releases/latest/download' \
            etc/xbps.d/repos-remote.conf
          chown -R builder:builder . &&
          sudo -Eu builder common/travis/set_mirror.sh &&
          sudo -Eu builder common/travis/prepare.sh &&
          common/travis/fetch-xtools.sh

      - name: Find changed templates
        run: |
          cd noid-packages/void-packages && sudo -Eu builder ./common/travis/changed_templates.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and check packages
        shell: bash
        run: |
          # Build packages
          mkdir -p ~/packages ~/hostdir
          chown -R builder:builder ~/packages &&
          chown -R builder:builder ~/hostdir &&

          cd noid-packages/void-packages
          for pkg in $(< /tmp/templates); do
            sudo -Eu builder ./xbps-src -j$(nproc) -s -H ~/hostdir pkg "$pkg"
          done

          cp ~/hostdir/binpkgs/*.xbps ~/packages/
